<!DOCTYPE html>
<html>
<head>
<title>Shape Summoner</title>
<style>
body { margin:0; overflow:hidden; background:#111; }
canvas { display:block; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const c = document.getElementById("game");
const x = c.getContext("2d");

function resize() {
  c.width = innerWidth;
  c.height = innerHeight;
}
resize();
onresize = resize;
// Player
const p = {
  x: c.width/2,
  y: c.height/2,
  r: 20,
  s: 5,
  col: "white",
  hp: 100,
  maxHp: 100,
  regen: 0.1,
  mana: 50,
  maxMana: 50,
  mRegen: 0.2,
  lvl: 1,
  xp: 0,
  xpNext: 20,
  dmg: 1,
  sCost: 5,
  shCost: 3,
  spdBoost: 0,
  multi: false,
  multiCount: 2,
  shootCooldown: 0,
  shootDelay: 10
};

// Game state
let boss = null;
let shots = [];
let bShots = [];
let sums = [];
let keys = {};
let shape = 1;
let lastX = p.x;
let lastY = p.y;
let dead = false;
let choose = false;
let cards = [];
let bossDropText = "";

// REGULAR + ELITE upgrade pool
const upgrades = [
  { name:"Max HP + Heal", apply(){ p.maxHp+=20; p.hp=p.maxHp; }},
  { name:"Max Mana + Restore", apply(){ p.maxMana+=20; p.mana=p.maxMana; }},
  { name:"Shot Damage Up", apply(){ p.dmg+=1; }},
  { name:"Regen Boost", apply(){ p.regen+=0.05; p.mRegen+=0.1; }},
  { name:"Move Speed Up", apply(){ p.s+=0.5; }},
  { name:"Summon HP Up", apply(){ sums.forEach(s=>s.hp+=10); }},
  { name:"Summon Radius Up", apply(){ sums.forEach(s=>s.r+=5); }},
  { name:"Mana Efficiency", apply(){ p.sCost=Math.max(1,p.sCost-1); p.shCost=Math.max(1,p.shCost-1); }},
  { name:"Projectile Speed Up", apply(){ p.spdBoost+=1; }},
  { name:"Multi-Shot +1", apply(){ p.multi=true; p.multiCount+=1; }},
  { name:"Faster Shooting", apply(){ p.shootDelay=Math.max(3,p.shootDelay-2); }}
];

// GOD upgrade pool
const godUpgrades = [
  { name:"God Power: +20 DMG", apply(){ p.dmg+=20; }},
  { name:"God Speed: +20 SPD", apply(){ p.s+=20; }},
  { name:"God Mana: +200 Max Mana", apply(){ p.maxMana+=200; p.mana=p.maxMana; }},
  { name:"God Vitality: +100 HP", apply(){ p.maxHp+=100; p.hp=p.maxHp; }},
  { name:"God Regen: +300% Mana Regen", apply(){ p.mRegen*=3; }},
  { name:"God Regen: +100% HP Regen", apply(){ p.regen*=2; }}
];

// DRAGON upgrade pool
const dragonUpgrades = [
  { name:"Dragon Fury: +25 DMG", apply(){ p.dmg+=25; }},
  { name:"Dragon Speed: +25 SPD", apply(){ p.s+=25; }},
  { name:"Dragon Breath: Infinite Mana", apply(){ p.maxMana=999999; p.mana=p.maxMana; }},
  { name:"Dragon Multishot +5", apply(){ p.multi=true; p.multiCount+=5; }},
  { name:"Dragon Skin: +150 HP", apply(){ p.maxHp+=150; p.hp=p.maxHp; }},
  { name:"Dragon Heart: +500% Mana Regen", apply(){ p.mRegen*=5; }}
];

// Mouse
onmousemove = e => {
  lastX = e.clientX;
  lastY = e.clientY;
};
// GOD + DRAGON PROJECTILES
function godShot(boss) {
  const a = Math.atan2(p.y - boss.y, p.x - boss.x);
  bShots.push({ x: boss.x, y: boss.y, r: 50, sp: 3, dx: Math.cos(a), dy: Math.sin(a), col: "yellow", dmg: 8 });
}

function dragonShot(boss) {
  const base = Math.atan2(p.y - boss.y, p.x - boss.x);
  const spread = 0.4;
  for (let i = -1; i <= 1; i++) {
    const a = base + spread * i;
    bShots.push({ x: boss.x, y: boss.y, r: 65, sp: 2.5, dx: Math.cos(a), dy: Math.sin(a), col: "orange", dmg: 10 });
  }
}

// BOSS SHOOTING
function bossShoot(boss) {
  if (boss.type === "god") return godShot(boss), boss.cd = 70;
  if (boss.type === "dragon") return dragonShot(boss), boss.cd = 90;

  const a = Math.atan2(p.y - boss.y, p.x - boss.x);
  bShots.push({
    x: boss.x, y: boss.y, r: 8, sp: 5,
    dx: Math.cos(a), dy: Math.sin(a),
    col: boss.elite ? "magenta" : "orange",
    dmg: boss.elite ? 4 : 2
  });
  boss.cd = boss.elite ? 40 : 60;
}

// BOSS SPAWN (80/15/4/1)
function spawnBoss() {
  const roll = Math.random();

  if (roll < 0.80) {
    boss = { x: Math.random()*c.width, y: Math.random()*c.height, r: 50, hp: 15, s: 2, col: "red", elite: false, cd: 0, type: "normal" };
    return;
  }

  if (roll < 0.95) {
    boss = { x: Math.random()*c.width, y: Math.random()*c.height, r: 70, hp: 40, s: 3, col: "purple", elite: true, cd: 0, type: "elite" };
    return;
  }

  if (roll < 0.99) {
    boss = { x: Math.random()*c.width, y: Math.random()*c.height, r: 120, hp: 120, s: 1.2, col: "gold", elite: false, cd: 0, type: "god" };
    return;
  }

  boss = { x: Math.random()*c.width, y: Math.random()*c.height, r: 175, hp: 180, s: 1, col: "darkgreen", elite: false, cd: 0, type: "dragon" };
}

setInterval(() => {
  if (!boss && !dead && !choose) spawnBoss();
}, 6000);
// Keys
onkeydown = e => {
  keys[e.key] = true;
  if (choose) return;
  if (e.key==="1") shape=1;
  if (e.key==="2") shape=2;
  if (e.key==="3") shape=3;
  if (e.key==="4") shape=4;
  if (e.key===" ") shoot();
};
onkeyup = e => keys[e.key] = false;

// Offer cards (regular + elite)
function offerCards() {
  choose = true;
  cards = [];
  while (cards.length < 3) {
    const cUp = upgrades[Math.floor(Math.random()*upgrades.length)];
    if (!cards.includes(cUp)) cards.push(cUp);
  }
}

// Offer GOD cards
function offerGodCards() {
  choose = true;
  cards = [];
  while (cards.length < 3) {
    const cUp = godUpgrades[Math.floor(Math.random()*godUpgrades.length)];
    if (!cards.includes(cUp)) cards.push(cUp);
  }
}

// Offer DRAGON cards
function offerDragonCards() {
  choose = true;
  cards = [];
  while (cards.length < 3) {
    const cUp = dragonUpgrades[Math.floor(Math.random()*dragonUpgrades.length)];
    if (!cards.includes(cUp)) cards.push(cUp);
  }
}

// Click
onclick = e => {
  if (choose) {
    const w=250,h=150,g=50;
    const sx = c.width/2 - (w*1.5 + g);
    const y = 250;
    for (let i=0;i<3;i++) {
      const xx = sx + i*(w+g);
      if (e.clientX>=xx && e.clientX<=xx+w &&
          e.clientY>=y && e.clientY<=y+h) {
        cards[i].apply();
        choose = false;
        return;
      }
    }
    return;
  }

  if (dead) return respawn();
  if (p.mana < p.sCost) return;

  p.mana -= p.sCost;

  sums.push({
    x: e.clientX, y: e.clientY,
    r: 20,
    col: `hsl(${Math.random()*360},80%,60%)`,
    sh: shape,
    hp: 10
  });

  fuseSummons();
};

// Shooting
function shoot() {
  if (dead || choose) return;
  if (p.shootCooldown > 0) return;
  if (p.mana < p.shCost) return;

  p.shootCooldown = p.shootDelay;
  p.mana -= p.shCost;

  const speed = 8 + p.spdBoost;
  const angle = Math.atan2(lastY - p.y, lastX - p.x);

  function makeShot(a) {
    shots.push({
      x: p.x, y: p.y, r: 12, sp: speed,
      dx: Math.cos(a), dy: Math.sin(a),
      col: `hsl(${Math.random()*360},80%,60%)`,
      sh: shape,
      dmg: p.dmg
    });
  }

  if (p.multi) {
    const n = p.multiCount;
    const spread = 0.25;
    for (let i = 0; i < n; i++) {
      const off = spread * ((i / (n - 1)) - 0.5);
      makeShot(angle + off);
    }
  } else {
    makeShot(angle);
  }
}

function respawn() {
  p.x = c.width / 2;
  p.y = c.height / 2;
  p.hp = p.maxHp;
  p.mana = p.maxMana;
  dead = false;
  boss = null;
  shots = [];
  bShots = [];
  sums = [];
}
// Draw summon / shot
function drawSummon(s) {
  x.fillStyle = s.col;
  x.beginPath();
  x.arc(s.x, s.y, s.r, 0, Math.PI * 2);
  x.fill();
}

// Fuse summons
function fuseSummons() {
  for (let i = 0; i < sums.length; i++) {
    for (let j = i + 1; j < sums.length; j++) {
      const a = sums[i], b = sums[j];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (d < a.r + b.r) {
        a.r += b.r * 0.5;
        a.hp += b.hp;
        sums.splice(j, 1);
        j--;
      }
    }
  }
}

// Level up
function levelUp() {
  p.lvl++;
  p.xp = 0;
  p.xpNext = Math.floor(p.xpNext * 1.5);
  p.maxHp += 10;
  p.hp = p.maxHp;
  p.maxMana += 10;
  p.mana = p.maxMana;
  p.dmg += 0.5;
  p.regen += 0.02;
}

// Update
function update() {
  if (p.shootCooldown > 0) p.shootCooldown--;

  if (!dead && !choose) {
    if (keys["w"] || keys["W"]) p.y -= p.s;
    if (keys["s"] || keys["S"]) p.y += p.s;
    if (keys["a"] || keys["A"]) p.x -= p.s;
    if (keys["d"] || keys["D"]) p.x += p.s;
    p.hp = Math.min(p.maxHp, p.hp + p.regen);
    p.mana = Math.min(p.maxMana, p.mana + p.mRegen);
  }

  // Boss logic
  if (boss && !dead && !choose) {
    let angle = Math.atan2(p.y - boss.y, p.x - boss.x);

    for (let i = 0; i < sums.length; i++) {
      const s = sums[i];
      const d = Math.hypot(boss.x - s.x, boss.y - s.y);
      if (d < boss.r + s.r) {
        s.hp -= 0.2;
        if (s.hp <= 0) {
          sums.splice(i, 1);
          i--;
        }
        angle += Math.PI / 2;
      }
    }

    boss.x += Math.cos(angle) * boss.s;
    boss.y += Math.sin(angle) * boss.s;

    boss.cd--;
    if (boss.cd <= 0) bossShoot(boss);
  }

  // Shots
  shots.forEach(s => {
    s.x += s.dx * s.sp;
    s.y += s.dy * s.sp;
  });

  bShots.forEach(b => {
    b.x += b.dx * b.sp;
    b.y += b.dy * b.sp;
  });

  // Player shots hit boss
  if (boss) {
    for (let i = shots.length - 1; i >= 0; i--) {
      const s = shots[i];
      const d = Math.hypot(s.x - boss.x, s.y - boss.y);
      if (d < s.r + boss.r) {
        boss.hp -= s.dmg;
        shots.splice(i, 1);

        if (boss.hp <= 0) {

          // GOD reward
          if (boss.type === "god") {
            rewardGod();
            offerGodCards();
            bossDropText = "GOD REWARD!";
            setTimeout(() => bossDropText = "", 3000);
            boss = null;
            return;
          }

          // DRAGON reward
          if (boss.type === "dragon") {
            rewardDragon();
            offerDragonCards();
            bossDropText = "DRAGON REWARD!";
            setTimeout(() => bossDropText = "", 3000);
            boss = null;
            return;
          }

          // ELITE reward
          if (boss.type === "elite") {
            bossDropText = "";
            boss = null;
            p.xp += 15;
            if (p.xp >= p.xpNext) levelUp();
            offerCards();
            return;
          }

          // NORMAL reward
          if (boss.type === "normal") {
            bossDropText = "";
            boss = null;
            p.xp += 10;
            if (p.xp >= p.xpNext) levelUp();
            return;
          }
        }
      }
    }
  }

  // Boss shots hit player / summons
  for (let i = bShots.length - 1; i >= 0; i--) {
    const b = bShots[i];
    const dp = Math.hypot(b.x - p.x, b.y - p.y);
    if (dp < b.r + p.r) {
      p.hp -= b.dmg;
      bShots.splice(i, 1);
      if (p.hp <= 0) {
        p.hp = 0;
        dead = true;
      }
      continue;
    }

    let hit = false;
    for (let j = 0; j < sums.length; j++) {
      const s = sums[j];
      const ds = Math.hypot(b.x - s.x, b.y - s.y);
      if (ds < b.r + s.r) {
        s.hp -= b.dmg;
        bShots.splice(i, 1);
        hit = true;
        if (s.hp <= 0) sums.splice(j, 1);
        break;
      }
    }
    if (hit) continue;

    if (b.x < -50 || b.x > c.width + 50 ||
        b.y < -50 || b.y > c.height + 50) {
      bShots.splice(i, 1);
    }
  }

  // Boss touches player
  if (boss && !dead && !choose) {
    const d = Math.hypot(p.x - boss.x, p.y - boss.y);
    if (d < p.r + boss.r) {
      p.hp -= 1;
      if (p.hp <= 0) {
        p.hp = 0;
        dead = true;
      }
    }
  }
}
// Draw
function draw() {
  x.setTransform(1,0,0,1,0,0);
  x.clearRect(0,0,c.width,c.height);

  // Player
  x.beginPath();
  x.arc(p.x,p.y,p.r,0,Math.PI*2);
  x.fillStyle=p.col;
  x.fill();

  // HP bar
  x.fillStyle="red";
  x
    // Boss labels
  if (boss) {
    x.fillStyle = "yellow";
    x.font = "20px Arial";

    if (boss.type === "god") {
      x.fillText("GOD", boss.x - 20, boss.y - boss.r - 40);
    }
    else if (boss.type === "dragon") {
      x.fillText("DRAGON", boss.x - 35, boss.y - boss.r - 40);
    }
    else if (boss.type === "elite") {
      x.fillText("ELITE", boss.x - 25, boss.y - boss.r - 40);
    }
    else {
      x.fillText("BOSS", boss.x - 20, boss.y - boss.r - 40);
    }
  }

  // Boss drop text (3 seconds)
  if (bossDropText) {
    x.fillStyle = "white";
    x.font = "28px Arial";
    x.fillText(bossDropText, c.width/2 - 200, c.height - 80);
  }

  // Upgrade UI
  if (choose) {
    x.fillStyle = "rgba(0,0,0,0.7)";
    x.fillRect(0,0,c.width,c.height);

    x.fillStyle = "white";
    x.font = "40px Arial";
    x.fillText("Choose an Upgrade", c.width/2 - 200, 150);

    const w = 250, h = 150, g = 50;
    const sx = c.width/2 - (w*1.5 + g);
    const y = 250;

    cards.forEach((card,i)=>{
      const xx = sx + i*(w+g);
      x.fillStyle = "#222";
      x.fillRect(xx, y, w, h);

      x.strokeStyle = "white";
      x.strokeRect(xx, y, w, h);

      x.fillStyle = "white";
      x.font = "24px Arial";
      x.fillText(card.name, xx + 20, y + h/2);
    });
  }

  // Death screen
  if (dead && !choose) {
    x.fillStyle = "rgba(0,0,0,0.7)";
    x.fillRect(0,0,c.width,c.height);

    x.fillStyle = "white";
    x.font = "60px Arial";
    x.fillText("YOU DIED", c.width/2 - 150, c.height/2 - 40);

    x.font = "30px Arial";
    x.fillText("Click to Respawn", c.width/2 - 150, c.height/2 + 20);
  }

  requestAnimationFrame(gameLoop);
}

function gameLoop() {
  update();
  draw();
}

gameLoop();
</script>
</body>
</html>
